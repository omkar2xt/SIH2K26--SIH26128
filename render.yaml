services:
  - type: web
    name: pashu-raksha-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pashu-raksha-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: CORS_ORIGIN
        value: https://sih-2-k26-sih-26128.vercel.app

databases:
  - name: pashu-raksha-db
    databaseName: pashuraksha
    user: pashuraksha
